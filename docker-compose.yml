services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      GRAPHQL_PLAYGROUND_ENABLED: ${GRAPHQL_PLAYGROUND_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-3000}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-healthcare}:${RABBITMQ_PASSWORD:-healthcare-local}@rabbitmq:5672
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-5}
      AUTH_LOGIN_RATE_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_WINDOW_SECONDS:-900}
      AUTH_REGISTER_RATE_LIMIT: ${AUTH_REGISTER_RATE_LIMIT:-10}
      AUTH_REGISTER_RATE_WINDOW_SECONDS: ${AUTH_REGISTER_RATE_WINDOW_SECONDS:-3600}
      OBSERVE_APP_KEY: ${OBSERVE_APP_KEY:-YOUR_APP_KEY}
      OBSERVE_APP_SECRET: ${OBSERVE_APP_SECRET:-YOUR_APP_SECRET}
    ports:
      - '${API_GATEWAY_HOST_PORT:-3000}:${API_GATEWAY_PORT:-3000}'
    depends_on:
      auth-service:
        condition: service_started
      schedule-service:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - healthcare-network

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-healthcare}:${RABBITMQ_PASSWORD:-healthcare-local}@rabbitmq:5672
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?Set AUTH_DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-5}
      AUTH_LOGIN_RATE_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_WINDOW_SECONDS:-900}
      AUTH_REGISTER_RATE_LIMIT: ${AUTH_REGISTER_RATE_LIMIT:-10}
      AUTH_REGISTER_RATE_WINDOW_SECONDS: ${AUTH_REGISTER_RATE_WINDOW_SECONDS:-3600}
      OBSERVE_APP_KEY: ${OBSERVE_APP_KEY:-YOUR_APP_KEY}
      OBSERVE_APP_SECRET: ${OBSERVE_APP_SECRET:-YOUR_APP_SECRET}
    depends_on:
      auth-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - healthcare-network

  schedule-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: schedule-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-healthcare}:${RABBITMQ_PASSWORD:-healthcare-local}@rabbitmq:5672
      SCHEDULE_DATABASE_URL: ${SCHEDULE_DATABASE_URL:?Set SCHEDULE_DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      QUERY_CACHE_TTL_SECONDS: ${QUERY_CACHE_TTL_SECONDS:-30}
      OBSERVE_APP_KEY: ${OBSERVE_APP_KEY:-YOUR_APP_KEY}
      OBSERVE_APP_SECRET: ${OBSERVE_APP_SECRET:-YOUR_APP_SECRET}
    depends_on:
      schedule-postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - healthcare-network

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: notification-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-healthcare}:${RABBITMQ_PASSWORD:-healthcare-local}@rabbitmq:5672
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Healthcare Schedule <no-reply@healthcare.local>}
      OBSERVE_APP_KEY: ${OBSERVE_APP_KEY:-YOUR_APP_KEY}
      OBSERVE_APP_SECRET: ${OBSERVE_APP_SECRET:-YOUR_APP_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - healthcare-network

  auth-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER:?Set AUTH_DB_USER in .env}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      POSTGRES_DB: ${AUTH_DB_NAME:?Set AUTH_DB_NAME in .env}
    ports:
      - '${AUTH_DB_HOST_PORT:-5433}:5432'
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - healthcare-network

  schedule-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SCHEDULE_DB_USER:?Set SCHEDULE_DB_USER in .env}
      POSTGRES_PASSWORD: ${SCHEDULE_DB_PASSWORD:?Set SCHEDULE_DB_PASSWORD in .env}
      POSTGRES_DB: ${SCHEDULE_DB_NAME:?Set SCHEDULE_DB_NAME in .env}
    ports:
      - '${SCHEDULE_DB_HOST_PORT:-5434}:5432'
    volumes:
      - schedule_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - healthcare-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - healthcare-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-healthcare}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-healthcare-local}
    ports:
      - '127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - healthcare-network

  redisinsight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDISINSIGHT_HOST_PORT:-5540}:5540'
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - healthcare-network

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_WEB_PORT:-8025}:8025'
    networks:
      - healthcare-network

volumes:
  auth_postgres_data:
  schedule_postgres_data:
  redis_data:
  redisinsight_data:
  rabbitmq_data:

networks:
  healthcare-network:
    driver: bridge
